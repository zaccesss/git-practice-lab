# a copy to paste into a GitLab project as .gitlab-ci.yml, not part of this repository's own CI

# without these rules a push to a branch with an open merge request runs two pipelines,
# one for the branch and one for the merge request
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - hello
  - count

say-hello:
  stage: hello
  image: alpine:3.22
  script:
    - echo "This pipeline ran on $CI_COMMIT_REF_NAME"

count-files:
  stage: count
  image: alpine:3.22
  script:
    - find practice -type f | wc -l
